<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Nakshatra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #F3EFE4; --ink-dim: #C9C3B2; --ink-faint: #8B8676;
    --night: #10142A; --night-2: #161B33; --night-3: #1E2440;
    --gold: #C9932E; --gold-soft: #E0B667;
    --line: rgba(243,239,228,0.12);
    --serif: 'Fraunces', serif; --sans: 'Inter', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--night); color:var(--ink); font-family:var(--sans); line-height:1.6; min-height:100vh; }
  a{color:inherit; text-decoration:none;}

  nav{ display:flex; align-items:center; justify-content:space-between; max-width:1100px; margin:0 auto; padding:28px 24px; }
  .brand{ font-family:var(--serif); font-size:22px; font-weight:500; }
  .brand em{ color:var(--gold-soft); font-style:normal; }
  .back-link{ font-size:13px; color:var(--ink-dim); }
  .back-link:hover{ color:var(--gold-soft); }

  .auth-wrap{ max-width:400px; margin:60px auto; padding:0 24px; }
  .auth-card{ background:var(--night-2); border:1px solid var(--line); border-radius:4px; padding:36px; }
  .auth-eyebrow{ font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold-soft); margin-bottom:10px; }
  .auth-title{ font-family:var(--serif); font-size:24px; font-weight:500; margin-bottom:8px; }
  .auth-sub{ font-size:13px; color:var(--ink-dim); margin-bottom:28px; }

  .mode-toggle{ display:flex; border:1px solid var(--line); border-radius:2px; overflow:hidden; margin-bottom:26px; }
  .mode-btn{ flex:1; background:none; border:none; color:var(--ink-dim); font-size:13px; padding:9px; cursor:pointer; font-family:var(--sans); }
  .mode-btn.active{ background:var(--gold); color:var(--night); font-weight:500; }

  label{ font-size:12px; color:var(--ink-dim); display:block; margin-bottom:6px; }
  .field{ margin-bottom:16px; }
  input{ width:100%; background:var(--night-3); border:1px solid var(--line); color:var(--ink); padding:12px 14px; font-size:14px; border-radius:2px; font-family:var(--sans); }
  input:focus{ outline:none; border-color:var(--gold); }

  .submit-btn{ width:100%; background:var(--gold); color:var(--night); font-weight:600; font-size:14px; padding:13px; border:none; border-radius:2px; cursor:pointer; margin-top:8px; }
  .submit-btn:hover{ background:var(--gold-soft); }

  .fine-print{ font-size:11.5px; color:var(--ink-faint); text-align:center; margin-top:20px; line-height:1.6; }
  .signup-only{ display:none; }
</style>
</head>
<body>

<nav>
  <div class="brand">Naksh<em>atra</em></div>
  <a href="index.html" class="back-link">&larr; Back to home</a>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-eyebrow">Nakshatra</div>
    <div class="auth-title" id="authTitle">Welcome back</div>
    <div class="auth-sub" id="authSub">Sign in to save your charts and readings.</div>

    <div class="mode-toggle">
      <button class="mode-btn active" id="btnSignin" onclick="setMode('signin')">Sign in</button>
      <button class="mode-btn" id="btnSignup" onclick="setMode('signup')">Create account</button>
    </div>

    <form onsubmit="return false;">
      <div class="field signup-only" id="nameField">
        <label>Full name</label>
        <input type="text" placeholder="Your name">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" placeholder="At least 8 characters">
      </div>
      <button class="submit-btn" id="submitBtn">Sign in</button>
    </form>

    <p class="fine-print">Account and saved charts require the site's backend to be connected. This form is ready for that integration.</p>
  </div>
</div>

<script>
function setMode(mode){
  const isSignup = mode === 'signup';
  document.getElementById('btnSignin').classList.toggle('active', !isSignup);
  document.getElementById('btnSignup').classList.toggle('active', isSignup);
  document.getElementById('nameField').style.display = isSignup ? 'block' : 'none';
  document.getElementById('authTitle').textContent = isSignup ? 'Create your account' : 'Welcome back';
  document.getElementById('authSub').textContent = isSignup ? 'Save charts, track dasha periods, and revisit readings anytime.' : 'Sign in to save your charts and readings.';
  document.getElementById('submitBtn').textContent = isSignup ? 'Create account' : 'Sign in';
}
</script>
</body>
</html>
